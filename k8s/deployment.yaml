apiVersion: apps/v1
kind: Deployment
metadata:
  name: sungava-it-club-deployment
  namespace: sungava-it-club
  labels:
    app: sungava-it-club
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sungava-it-club
  template:
    metadata:
      labels:
        app: sungava-it-club
    spec:
      containers:
        - name: web
          image: sungava-it-club:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
